[package]
name = "ansible-rust-lint"
version = "25.5.0"
edition = "2021"

[[bin]]
name = "ansible-rust-lint"
path = "crates/ansible-lint/src/main.rs"

[dependencies]
ansible-lint-core = { path = "crates/ansible-lint-core" }
anyhow = { workspace = true }
clap = { workspace = true }
owo-colors = { workspace = true }
serde_json = { workspace = true }

[workspace]
members = [
    "crates/ansible-lint-core",
]
resolver = "2"

[workspace.dependencies]
# Core
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
yaml-rust2 = "0.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# File system
walkdir = "2"
globset = "0.4"
ignore = "0.4"

# Text / regex
regex = "1"
owo-colors = "4"

# Data structures
indexmap = { version = "2", features = ["serde"] }

# Config
toml = "0.8"
